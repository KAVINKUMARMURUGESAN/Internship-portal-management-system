<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Internships</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/dashboard">

            Internship Portal

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/dashboard"
               class="btn btn-light rounded-pill px-4">

                Dashboard

            </a>

            <a href="/profile"
               class="btn btn-outline-light rounded-pill px-4">

                Profile

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <!-- Header -->

        <div class="text-center mb-5">

            <h1 class="fw-bold display-4">
                Available Internships
            </h1>

            <p class="text-muted fs-5">

                Explore top internship opportunities

            </p>

        </div>

        <!-- Internship Cards -->

        <div class="row g-4">

            <!-- Internship Card -->

            <div class="col-lg-4"
                 th:each="internship : ${internships}">

                <div class="card border-0 shadow-lg rounded-5 h-100 card-hover overflow-hidden">

                    <!-- Top -->

                    <div class="gradient-bg text-white p-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <h3 class="fw-bold"
                                    th:text="${internship.title}">

                                    Internship Title

                                </h3>

                                <p class="mb-0 opacity-75"
                                   th:text="${internship.companyName}">

                                    Company Name

                                </p>

                            </div>

                            <div>

                                <i class="fa-solid fa-briefcase fs-1"></i>

                            </div>

                        </div>

                    </div>

                    <!-- Body -->

                    <div class="card-body p-4">

                        <!-- Duration -->

                        <div class="mb-3">

                            <span class="badge bg-primary px-3 py-2 rounded-pill">

                                <i class="fa-solid fa-clock"></i>

                                <span th:text="${internship.duration}">
                                    Duration
                                </span>

                            </span>

                        </div>

                        <!-- Skills -->

                        <div class="mb-3">

                            <h6 class="fw-bold">
                                Skills Required
                            </h6>

                            <p class="text-muted"
                               th:text="${internship.skills}">

                                Skills

                            </p>

                        </div>

                        <!-- Description -->

                        <div class="mb-3">

                            <h6 class="fw-bold">
                                Description
                            </h6>

                            <p class="text-muted"
                               th:text="${internship.description}">

                                Description

                            </p>

                        </div>

                        <!-- Last Date -->

                        <div class="mb-4">

                            <span class="badge bg-danger px-3 py-2 rounded-pill">

                                Last Date:

                                <span th:text="${internship.lastDate}">
                                    Date
                                </span>

                            </span>

                        </div>

                        <!-- Status -->

                        <div class="mb-4">

                            <span class="badge bg-success px-3 py-2 rounded-pill"
                                  th:text="${internship.status}">

                                Active

                            </span>

                        </div>

                        <!-- Buttons -->

                        <div class="d-flex gap-3">

                            <a href="/apply"
                               class="btn btn-primary rounded-pill w-100 py-2 shadow">

                                <i class="fa-solid fa-paper-plane"></i>
                                Apply

                            </a>

                            <a href="/internship-details"
                               class="btn btn-outline-dark rounded-pill w-100 py-2">

                                Details

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Footer -->

<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">
        © 2026 Internship Portal. All Rights Reserved.
    </p>

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
