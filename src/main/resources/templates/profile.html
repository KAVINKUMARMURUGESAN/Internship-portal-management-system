<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/dashboard">

            Student Profile

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/dashboard"
               class="btn btn-light rounded-pill px-4">

                Dashboard

            </a>

            <a href="/logout"
               class="btn btn-danger rounded-pill px-4">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Profile Section -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Profile Card -->

                <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

                    <!-- Header -->

                    <div class="gradient-bg text-white text-center p-5">

                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                             width="120"
                             class="mb-4 rounded-circle bg-white p-2">

                        <h1 class="fw-bold"
                            th:text="${student.name}">

                            Student Name

                        </h1>

                        <p class="opacity-75 mb-0">

                            Internship Portal Student

                        </p>

                    </div>

                    <!-- Details -->

                    <div class="p-5">

                        <div class="row g-4">

                            <!-- Name -->

                            <div class="col-md-6">

                                <div class="profile-box">

                                    <h6 class="text-muted">
                                        Full Name
                                    </h6>

                                    <h5 th:text="${student.name}">
                                        Name
                                    </h5>

                                </div>

                            </div>

                            <!-- Email -->

                            <div class="col-md-6">

                                <div class="profile-box">

                                    <h6 class="text-muted">
                                        Email
                                    </h6>

                                    <h5 th:text="${student.email}">
                                        Email
                                    </h5>

                                </div>

                            </div>

                            <!-- Phone -->

                            <div class="col-md-6">

                                <div class="profile-box">

                                    <h6 class="text-muted">
                                        Phone
                                    </h6>

                                    <h5 th:text="${student.phone}">
                                        Phone
                                    </h5>

                                </div>

                            </div>

                            <!-- College -->

                            <div class="col-md-6">

                                <div class="profile-box">

                                    <h6 class="text-muted">
                                        College
                                    </h6>

                                    <h5 th:text="${student.college}">
                                        College
                                    </h5>

                                </div>

                            </div>

                            <!-- Department -->

                            <div class="col-md-6">

                                <div class="profile-box">

                                    <h6 class="text-muted">
                                        Department
                                    </h6>

                                    <h5 th:text="${student.department}">
                                        Department
                                    </h5>

                                </div>

                            </div>

                            <!-- Created Date -->

                            <div class="col-md-6">

                                <div class="profile-box">

                                    <h6 class="text-muted">
                                        Joined Date
                                    </h6>

                                    <h5 th:text="${student.createdAt}">
                                        Date
                                    </h5>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
