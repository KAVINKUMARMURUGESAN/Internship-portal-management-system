<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Internship Details</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/dashboard">

            Internship Details

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/internships"
               class="btn btn-light rounded-pill px-4">

                Back

            </a>

            <a href="/logout"
               class="btn btn-danger rounded-pill px-4">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <!-- Main Card -->

                <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

                    <!-- Header -->

                    <div class="gradient-bg text-white p-5">

                        <h1 class="fw-bold display-4 mb-3"
                            th:text="${internship.title}">

                            Internship Title

                        </h1>

                        <h4 class="opacity-75"
                            th:text="${internship.companyName}">

                            Company Name

                        </h4>

                    </div>

                    <!-- Body -->

                    <div class="p-5">

                        <div class="row g-4">

                            <!-- Duration -->

                            <div class="col-md-6">

                                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">

                                    <h6 class="text-muted mb-3">

                                        Duration

                                    </h6>

                                    <h4 class="fw-bold"
                                        th:text="${internship.duration}">

                                        6 Months

                                    </h4>

                                </div>

                            </div>

                            <!-- Last Date -->

                            <div class="col-md-6">

                                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">

                                    <h6 class="text-muted mb-3">

                                        Last Date

                                    </h6>

                                    <h4 class="fw-bold"
                                        th:text="${internship.lastDate}">

                                        2026-05-30

                                    </h4>

                                </div>

                            </div>

                            <!-- Status -->

                            <div class="col-md-6">

                                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">

                                    <h6 class="text-muted mb-3">

                                        Internship Status

                                    </h6>

                                    <span class="badge bg-success px-4 py-3 rounded-pill fs-6"
                                          th:text="${internship.status}">

                                        Active

                                    </span>

                                </div>

                            </div>

                            <!-- Skills -->

                            <div class="col-md-6">

                                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">

                                    <h6 class="text-muted mb-3">

                                        Required Skills

                                    </h6>

                                    <h5 class="fw-semibold"
                                        th:text="${internship.skills}">

                                        Java, Spring Boot

                                    </h5>

                                </div>

                            </div>

                            <!-- Description -->

                            <div class="col-12">

                                <div class="card border-0 shadow-sm rounded-4 p-4">

                                    <h5 class="fw-bold mb-4">

                                        Internship Description

                                    </h5>

                                    <p class="fs-5 lh-lg"
                                       th:text="${internship.description}">

                                        Internship description...

                                    </p>

                                </div>

                            </div>

                        </div>

                        <!-- Buttons -->

                        <div class="d-flex gap-4 mt-5 flex-wrap">

                            <!-- Apply -->

                            <a href="/apply"
                               class="btn btn-primary btn-lg rounded-pill px-5 py-3 shadow">

                                <i class="fa-solid fa-paper-plane"></i>

                                Apply Now

                            </a>

                            <!-- Back -->

                            <a href="/internships"
                               class="btn btn-outline-dark btn-lg rounded-pill px-5 py-3">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
