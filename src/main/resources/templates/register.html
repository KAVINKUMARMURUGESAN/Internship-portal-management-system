<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="gradient-bg min-vh-100 d-flex align-items-center justify-content-center py-5">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="glass rounded-5 shadow-lg overflow-hidden">

                <div class="row g-0">

                    <!-- Left Side -->

                    <div class="col-lg-5 d-none d-lg-flex align-items-center justify-content-center p-5 text-white">

                        <div class="text-center">

                            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                                 class="img-fluid mb-4"
                                 width="220">

                            <h2 class="fw-bold mb-3">
                                Join Internship Portal
                            </h2>

                            <p class="opacity-75">

                                Build your future with top internships
                                and industry opportunities.

                            </p>

                        </div>

                    </div>

                    <!-- Right Side -->

                    <div class="col-lg-7 bg-white p-5">

                        <!-- Header -->

                        <div class="text-center mb-5">

                            <h1 class="fw-bold">
                                Student Registration
                            </h1>

                            <p class="text-muted">

                                Create your account

                            </p>

                        </div>

                        <!-- Form -->

                        <form th:action="@{/saveStudent}"
                              th:object="${student}"
                              method="post">

                            <div class="row g-4">

                                <!-- Full Name -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Full Name
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text rounded-start-pill bg-light border-0">

                                            <i class="fa-solid fa-user"></i>

                                        </span>

                                        <input type="text"
                                               th:field="*{name}"
                                               class="form-control rounded-end-pill border-0 bg-light"
                                               placeholder="Enter full name"
                                               required>

                                    </div>

                                </div>

                                <!-- Email -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Email
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text rounded-start-pill bg-light border-0">

                                            <i class="fa-solid fa-envelope"></i>

                                        </span>

                                        <input type="email"
                                               th:field="*{email}"
                                               class="form-control rounded-end-pill border-0 bg-light"
                                               placeholder="Enter email"
                                               required>

                                    </div>

                                </div>

                                <!-- Phone -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Phone
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text rounded-start-pill bg-light border-0">

                                            <i class="fa-solid fa-phone"></i>

                                        </span>

                                        <input type="text"
                                               th:field="*{phone}"
                                               class="form-control rounded-end-pill border-0 bg-light"
                                               placeholder="Enter phone"
                                               required>

                                    </div>

                                </div>

                                <!-- College -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        College
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text rounded-start-pill bg-light border-0">

                                            <i class="fa-solid fa-building-columns"></i>

                                        </span>

                                        <input type="text"
                                               th:field="*{college}"
                                               class="form-control rounded-end-pill border-0 bg-light"
                                               placeholder="Enter college"
                                               required>

                                    </div>

                                </div>

                                <!-- Department -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Department
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text rounded-start-pill bg-light border-0">

                                            <i class="fa-solid fa-graduation-cap"></i>

                                        </span>

                                        <input type="text"
                                               th:field="*{department}"
                                               class="form-control rounded-end-pill border-0 bg-light"
                                               placeholder="Enter department"
                                               required>

                                    </div>

                                </div>

                                <!-- Password -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Password
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text rounded-start-pill bg-light border-0">

                                            <i class="fa-solid fa-lock"></i>

                                        </span>

                                        <input type="password"
                                               th:field="*{password}"
                                               class="form-control rounded-end-pill border-0 bg-light"
                                               placeholder="Enter password"
                                               required>

                                    </div>

                                </div>

                            </div>

                            <!-- Button -->

                            <button type="submit"
                                    class="btn btn-primary w-100 rounded-pill py-3 fw-bold mt-5 shadow">

                                <i class="fa-solid fa-user-plus"></i>
                                Create Account

                            </button>

                        </form>

                        <!-- Login Link -->

                        <div class="text-center mt-4">

                            <p class="text-muted">

                                Already have an account?

                                <a href="/login"
                                   class="text-decoration-none fw-semibold">

                                    Login

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
