<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="gradient-bg min-vh-100 d-flex align-items-center justify-content-center">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="glass bg-white rounded-5 shadow-lg overflow-hidden">

                <!-- Top Section -->

                <div class="gradient-bg text-white text-center p-5">

                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                         width="120"
                         class="mb-4">

                    <h1 class="fw-bold">
                        Welcome Back
                    </h1>

                    <p class="opacity-75 mb-0">

                        Login to your internship portal account

                    </p>

                </div>

                <!-- Form Section -->

                <div class="p-5">

                    <form th:action="@{/studentLogin}"
                          method="post">

                        <!-- Error Message -->

                        <div th:if="${error}"
                             class="alert alert-danger rounded-pill text-center">

                            <span th:text="${error}"></span>

                        </div>

                        <!-- Email -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Email Address
                            </label>

                            <div class="input-group">

                                <span class="input-group-text rounded-start-pill border-0 bg-light">

                                    <i class="fa-solid fa-envelope"></i>

                                </span>

                                <input type="email"
                                       name="email"
                                       class="form-control rounded-end-pill border-0 bg-light"
                                       placeholder="Enter email"
                                       required>

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text rounded-start-pill border-0 bg-light">

                                    <i class="fa-solid fa-lock"></i>

                                </span>

                                <input type="password"
                                       name="password"
                                       class="form-control rounded-end-pill border-0 bg-light"
                                       placeholder="Enter password"
                                       required>

                            </div>

                        </div>

                        <!-- Remember -->

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="remember">

                                <label class="form-check-label"
                                       for="remember">

                                    Remember Me

                                </label>

                            </div>

                            <a href="#"
                               class="text-decoration-none">

                                Forgot Password?

                            </a>

                        </div>

                        <!-- Login Button -->

                        <button type="submit"
                                class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow">

                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login

                        </button>

                    </form>

                    <!-- Register Link -->

                    <div class="text-center mt-4">

                        <p class="text-muted">

                            Don't have an account?

                            <a href="/register"
                               class="text-decoration-none fw-semibold">

                                Register

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
