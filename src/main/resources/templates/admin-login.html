<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="gradient-bg min-vh-100 d-flex align-items-center justify-content-center">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="glass bg-white rounded-5 shadow-lg overflow-hidden">

                <!-- Header -->

                <div class="gradient-bg text-white text-center p-5">

                    <i class="fa-solid fa-user-shield fa-4x mb-4"></i>

                    <h1 class="fw-bold">
                        Admin Login
                    </h1>

                    <p class="opacity-75 mb-0">

                        Internship Portal Administration

                    </p>

                </div>

                <!-- Form -->

                <div class="p-5">

                    <form th:action="@{/adminLogin}"
                          method="post">

                        <!-- Error -->

                        <div th:if="${error}"
                             class="alert alert-danger rounded-pill text-center">

                            <span th:text="${error}"></span>

                        </div>

                        <!-- Username -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <div class="input-group">

                                <span class="input-group-text rounded-start-pill border-0 bg-light">

                                    <i class="fa-solid fa-user"></i>

                                </span>

                                <input type="text"
                                       name="username"
                                       class="form-control rounded-end-pill border-0 bg-light"
                                       placeholder="Enter username"
                                       required>

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text rounded-start-pill border-0 bg-light">

                                    <i class="fa-solid fa-lock"></i>

                                </span>

                                <input type="password"
                                       name="password"
                                       class="form-control rounded-end-pill border-0 bg-light"
                                       placeholder="Enter password"
                                       required>

                            </div>

                        </div>

                        <!-- Button -->

                        <button type="submit"
                                class="btn btn-dark w-100 rounded-pill py-3 fw-bold shadow">

                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login as Admin

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
