<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Internship</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/admin-dashboard">

            Admin Panel

        </a>

        <div class="ms-auto">

            <a href="/manage-internships"
               class="btn btn-light rounded-pill px-4">

                Manage Internships

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

                    <!-- Header -->

                    <div class="gradient-bg text-white p-5">

                        <h1 class="fw-bold display-5">
                            Add Internship
                        </h1>

                        <p class="opacity-75 fs-5 mb-0">

                            Create and publish internship opportunities

                        </p>

                    </div>

                    <!-- Form -->

                    <div class="p-5">

                        <form th:action="@{/saveInternship}"
                              th:object="${internship}"
                              method="post">

                            <div class="row g-4">

                                <!-- Title -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Internship Title
                                    </label>

                                    <input type="text"
                                           th:field="*{title}"
                                           class="form-control form-control-lg rounded-pill"
                                           placeholder="Frontend Developer"
                                           required>

                                </div>

                                <!-- Company -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Company Name
                                    </label>

                                    <input type="text"
                                           th:field="*{companyName}"
                                           class="form-control form-control-lg rounded-pill"
                                           placeholder="Google"
                                           required>

                                </div>

                                <!-- Duration -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Duration
                                    </label>

                                    <input type="text"
                                           th:field="*{duration}"
                                           class="form-control form-control-lg rounded-pill"
                                           placeholder="6 Months"
                                           required>

                                </div>

                                <!-- Last Date -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Last Date
                                    </label>

                                    <input type="date"
                                           th:field="*{lastDate}"
                                           class="form-control form-control-lg rounded-pill"
                                           required>

                                </div>

                                <!-- Skills -->

                                <div class="col-12">

                                    <label class="form-label fw-semibold">
                                        Skills Required
                                    </label>

                                    <input type="text"
                                           th:field="*{skills}"
                                           class="form-control form-control-lg rounded-pill"
                                           placeholder="HTML, CSS, JavaScript, React"
                                           required>

                                </div>

                                <!-- Description -->

                                <div class="col-12">

                                    <label class="form-label fw-semibold">
                                        Description
                                    </label>

                                    <textarea rows="7"
                                              th:field="*{description}"
                                              class="form-control rounded-4"
                                              placeholder="Write internship description..."
                                              required></textarea>

                                </div>

                                <!-- Status -->

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold">
                                        Status
                                    </label>

                                    <select th:field="*{status}"
                                            class="form-select form-select-lg rounded-pill">

                                        <option value="Active">
                                            Active
                                        </option>

                                        <option value="Closed">
                                            Closed
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <!-- Button -->

                            <button type="submit"
                                    class="btn btn-primary btn-lg rounded-pill px-5 shadow w-100 mt-5">

                                <i class="fa-solid fa-plus"></i>
                                Publish Internship

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Footer -->

<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">
        © 2026 Internship Portal Admin Panel
    </p>

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
