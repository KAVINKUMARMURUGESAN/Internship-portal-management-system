<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Application Status</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/dashboard">

            Application Status

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/dashboard"
               class="btn btn-light rounded-pill px-4">

                Dashboard

            </a>

            <a href="/logout"
               class="btn btn-danger rounded-pill px-4">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <!-- Heading -->

        <div class="text-center mb-5">

            <h1 class="fw-bold display-5">

                My Applications

            </h1>

            <p class="text-muted fs-5">

                Track your internship applications

            </p>

        </div>

        <!-- Table -->

        <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <!-- Table Head -->

                    <thead class="gradient-bg text-white">

                    <tr>

                        <th class="py-4 px-4">
                            ID
                        </th>

                        <th>
                            Student ID
                        </th>

                        <th>
                            Internship ID
                        </th>

                        <th>
                            Resume
                        </th>

                        <th>
                            Applied Date
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                    </thead>

                    <!-- Table Body -->

                    <tbody>

                    <tr th:each="app : ${applications}">

                        <!-- Application ID -->

                        <td class="px-4"
                            th:text="${app.id}">

                            1

                        </td>

                        <!-- Student ID -->

                        <td th:text="${app.studentId}">

                            1

                        </td>

                        <!-- Internship ID -->

                        <td th:text="${app.internshipId}">

                            1

                        </td>

                        <!-- Resume -->

                        <td th:text="${app.resumePath}">

                            resume.pdf

                        </td>

                        <!-- Applied Date -->

                        <td th:text="${app.appliedDate}">

                            2026-05-22

                        </td>

                        <!-- Status -->

                        <td>

                            <span class="badge px-3 py-2 rounded-pill"

                                  th:classappend="
                                  ${app.status == 'Approved'} ? 'bg-success' :
                                  (${app.status == 'Rejected'} ? 'bg-danger' : 'bg-warning')
                                  "

                                  th:text="${app.status}">

                                Pending

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
