<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Internships</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/admin-dashboard">

            Admin Panel

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/add-internship"
               class="btn btn-light rounded-pill px-4">

                Add Internship

            </a>

            <a href="/admin-dashboard"
               class="btn btn-outline-light rounded-pill px-4">

                Dashboard

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center flex-wrap mb-5">

            <div>

                <h1 class="fw-bold display-5">
                    Manage Internships
                </h1>

                <p class="text-muted fs-5">

                    View and manage internship postings

                </p>

            </div>

        </div>

        <!-- Internship Table -->

        <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="gradient-bg text-white">

                    <tr>

                        <th class="py-4 px-4">
                            Title
                        </th>

                        <th>
                            Company
                        </th>

                        <th>
                            Duration
                        </th>

                        <th>
                            Skills
                        </th>

                        <th>
                            Last Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th class="text-center">
                            Actions
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <!-- Dynamic Internships -->

                    <tr th:each="internship : ${internships}">

                        <!-- Title -->

                        <td class="px-4 py-4">

                            <div class="fw-bold"
                                 th:text="${internship.title}">

                                Internship Title

                            </div>

                        </td>

                        <!-- Company -->

                        <td th:text="${internship.companyName}">

                            Company

                        </td>

                        <!-- Duration -->

                        <td th:text="${internship.duration}">

                            Duration

                        </td>

                        <!-- Skills -->

                        <td th:text="${internship.skills}">

                            Skills

                        </td>

                        <!-- Last Date -->

                        <td th:text="${internship.lastDate}">

                            Date

                        </td>

                        <!-- Status -->

                        <td>

                            <span class="badge px-3 py-2 rounded-pill"

                                  th:classappend="${internship.status == 'Active'} ? 'bg-success' :
                                                   'bg-danger'"

                                  th:text="${internship.status}">

                                Active

                            </span>

                        </td>

                        <!-- Actions -->

                        <td class="text-center">

                            <div class="d-flex gap-2 justify-content-center">

                                <!-- Edit -->

                                <button class="btn btn-warning rounded-pill px-3">

                                    <i class="fa-solid fa-pen"></i>

                                </button>

                                <!-- Delete -->

                                <a th:href="@{/delete-internship/{id}(id=${internship.id})}"
                                   class="btn btn-danger rounded-pill px-3"
                                   onclick="return confirm('Delete this internship?')">

                                    <i class="fa-solid fa-trash"></i>

                                </a>

                                <!-- View -->

                                <button class="btn btn-primary rounded-pill px-3">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

<!-- Footer -->

<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">
        © 2026 Internship Portal Admin Panel
    </p>

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
