<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Students Management</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/admin-dashboard">

            Admin Panel

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/applications"
               class="btn btn-light rounded-pill px-4">

                Applications

            </a>

            <a href="/manage-internships"
               class="btn btn-outline-light rounded-pill px-4">

                Internships

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <!-- Header -->

        <div class="text-center mb-5">

            <h1 class="fw-bold display-4">
                Students Management
            </h1>

            <p class="text-muted fs-5">

                View all registered students

            </p>

        </div>

        <!-- Table -->

        <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

            <div class="table-responsive">

                <table class="table align-middle mb-0">

                    <thead class="gradient-bg text-white">

                    <tr>

                        <th class="py-4 px-4">
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            College
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Created Date
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <!-- Dynamic Students -->

                    <tr th:each="student : ${students}">

                        <!-- ID -->

                        <td class="px-4 py-4">

                            <span class="fw-bold"
                                  th:text="${student.id}">

                                1

                            </span>

                        </td>

                        <!-- Name -->

                        <td th:text="${student.name}">

                            Student Name

                        </td>

                        <!-- Email -->

                        <td th:text="${student.email}">

                            student@gmail.com

                        </td>

                        <!-- Phone -->

                        <td th:text="${student.phone}">

                            9876543210

                        </td>

                        <!-- College -->

                        <td th:text="${student.college}">

                            ABC College

                        </td>

                        <!-- Department -->

                        <td th:text="${student.department}">

                            CSE

                        </td>

                        <!-- Created Date -->

                        <td th:text="${student.createdAt}">

                            Date

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

<!-- Footer -->

<footer class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">
        © 2026 Internship Portal Admin Panel
    </p>

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
