<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apply Internship</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/dashboard">

            Apply Internship

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/dashboard"
               class="btn btn-light rounded-pill px-4">

                Dashboard

            </a>

            <a href="/logout"
               class="btn btn-danger rounded-pill px-4">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Card -->

                <div class="card border-0 shadow-lg rounded-5 overflow-hidden">

                    <!-- Header -->

                    <div class="gradient-bg text-white text-center p-5">

                        <h1 class="fw-bold display-5">

                            Apply for Internship

                        </h1>

                        <p class="opacity-75 fs-5">

                            Submit your internship application

                        </p>

                    </div>

                    <!-- Form -->

                    <div class="p-5">

                        <form th:action="@{/saveApplication}"
                              method="post">

                            <!-- Full Name -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input type="text"
                                       class="form-control rounded-pill p-3"
                                       placeholder="Enter your full name"
                                       required>

                            </div>

                            <!-- Skills -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Skills

                                </label>

                                <input type="text"
                                       class="form-control rounded-pill p-3"
                                       placeholder="Java, Spring Boot, PostgreSQL..."
                                       required>

                            </div>

                            <!-- Experience -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Experience Level

                                </label>

                                <select class="form-select rounded-pill p-3">

                                    <option>
                                        Beginner
                                    </option>

                                    <option>
                                        Intermediate
                                    </option>

                                    <option>
                                        Advanced
                                    </option>

                                </select>

                            </div>

                            <!-- Preferred Location -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Preferred Location

                                </label>

                                <input type="text"
                                       class="form-control rounded-pill p-3"
                                       placeholder="Chennai, Bangalore, Remote">

                            </div>

                            <!-- Portfolio -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Portfolio / GitHub Link

                                </label>

                                <input type="url"
                                       class="form-control rounded-pill p-3"
                                       placeholder="https://github.com/yourprofile">

                            </div>

                            <!-- Availability -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Availability

                                </label>

                                <select class="form-select rounded-pill p-3">

                                    <option>
                                        Immediate
                                    </option>

                                    <option>
                                        Within 1 Week
                                    </option>

                                    <option>
                                        Within 1 Month
                                    </option>

                                </select>

                            </div>

                            <!-- Cover Letter -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Cover Letter

                                </label>

                                <textarea class="form-control rounded-4 p-3"
                                          rows="5"
                                          placeholder="Tell us why you are suitable for this internship..."></textarea>

                            </div>

                            <!-- Status -->

                            <input type="hidden"
                                   name="status"
                                   value="Pending">

                            <!-- Submit Button -->

                            <button type="submit"
                                    class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-lg">

                                <i class="fa-solid fa-paper-plane"></i>

                                Submit Application

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
