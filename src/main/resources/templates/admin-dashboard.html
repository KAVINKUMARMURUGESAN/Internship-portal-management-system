<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="/css/dashboard.css">

</head>

<body class="bg-light">

<!-- Sidebar + Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark gradient-bg shadow py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="/admin-dashboard">

            Admin Dashboard

        </a>

        <div class="ms-auto d-flex gap-3">

            <a href="/manage-internships"
               class="btn btn-light rounded-pill px-4">

                Internships

            </a>

            <a href="/applications"
               class="btn btn-outline-light rounded-pill px-4">

                Applications

            </a>

            <a href="/admin-logout"
               class="btn btn-danger rounded-pill px-4">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->

<section class="py-5">

    <div class="container">

        <!-- Header -->

        <div class="mb-5 text-center">

            <h1 class="fw-bold display-4">
                Welcome Admin
            </h1>

            <p class="text-muted fs-5">

                Internship Portal Analytics Dashboard

            </p>

        </div>

        <!-- Stats Cards -->

        <div class="row g-4">

            <!-- Students -->

            <div class="col-lg-4">

                <div class="card border-0 shadow-lg rounded-5 p-4 card-hover">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="text-muted">
                                Total Students
                            </h5>

                            <h1 class="fw-bold display-4"
                                th:text="${studentsCount}">

                                0

                            </h1>

                        </div>

                        <div class="icon-box bg-primary text-white">

                            <i class="fa-solid fa-users"></i>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Internships -->

            <div class="col-lg-4">

                <div class="card border-0 shadow-lg rounded-5 p-4 card-hover">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="text-muted">
                                Total Internships
                            </h5>

                            <h1 class="fw-bold display-4"
                                th:text="${internshipsCount}">

                                0

                            </h1>

                        </div>

                        <div class="icon-box bg-success text-white">

                            <i class="fa-solid fa-briefcase"></i>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Applications -->

            <div class="col-lg-4">

                <div class="card border-0 shadow-lg rounded-5 p-4 card-hover">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h5 class="text-muted">
                                Applications
                            </h5>

                            <h1 class="fw-bold display-4"
                                th:text="${applicationsCount}">

                                0

                            </h1>

                        </div>

                        <div class="icon-box bg-danger text-white">

                            <i class="fa-solid fa-file"></i>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Quick Actions -->

        <div class="row mt-5 g-4">

            <!-- Add Internship -->

            <div class="col-lg-4">

                <a href="/add-internship"
                   class="text-decoration-none">

                    <div class="card border-0 shadow-lg rounded-5 p-5 text-center card-hover">

                        <i class="fa-solid fa-plus fa-3x text-primary mb-4"></i>

                        <h3 class="fw-bold">
                            Add Internship
                        </h3>

                    </div>

                </a>

            </div>

            <!-- Students -->

            <div class="col-lg-4">

                <a href="/students"
                   class="text-decoration-none">

                    <div class="card border-0 shadow-lg rounded-5 p-5 text-center card-hover">

                        <i class="fa-solid fa-user-graduate fa-3x text-success mb-4"></i>

                        <h3 class="fw-bold">
                            Students
                        </h3>

                    </div>

                </a>

            </div>

            <!-- Applications -->

            <div class="col-lg-4">

                <a href="/applications"
                   class="text-decoration-none">

                    <div class="card border-0 shadow-lg rounded-5 p-5 text-center card-hover">

                        <i class="fa-solid fa-file-circle-check fa-3x text-danger mb-4"></i>

                        <h3 class="fw-bold">
                            Applications
                        </h3>

                    </div>

                </a>

            </div>

        </div>

    </div>

</section>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
